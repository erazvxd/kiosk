<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오늘의 카페 | 주문하기</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="brand"><span class="brand-icon">✳</span><span>오늘의 카페<small>CAFE ORDER</small></span></div><span class="header-note"><b>01</b> 메뉴 선택 <span>›</span> <b>02</b> 주문 확인 <span>›</span> <b>03</b> 주문 완료</span></header>
<main><section class="intro"><div><p class="eyebrow">WELCOME TO OUR CAFE</p><h1>메뉴를 선택해 주세요<span>.</span></h1><p>원하시는 메뉴를 터치하면 주문 내역에 담겨요.</p></div><div class="intro-art" aria-hidden="true">☕ <span>오늘도 맛있는<br>한 잔 하세요!</span></div></section>
<div class="layout"><section class="menu-section"><div class="section-heading"><div><p class="eyebrow">OUR MENU</p><h2>메뉴 고르기</h2></div><span>원하는 메뉴를 눌러 담아주세요</span></div><div id="categories" class="categories"></div><div id="menu" class="menu-grid" aria-live="polite"></div><p id="menu-error" class="error" role="alert"></p></section>
<aside class="cart"><div class="cart-head"><div><p class="eyebrow">MY ORDER</p><h2>주문 내역 <span id="count">0</span></h2></div><button id="clear" class="text-button">전체 삭제</button></div><div id="cart-items" class="cart-items"></div><div class="cart-bottom"><div class="total"><span>총 결제 금액</span><strong id="total">0원</strong></div><button id="checkout" class="checkout" disabled>주문하기 <span>→</span></button><p>테스트 주문 · 실제 결제되지 않습니다</p></div></aside></div></main>
<dialog id="complete"><div class="success-icon">✓</div><p class="eyebrow">ORDER COMPLETE</p><h2>주문이 완료되었어요!</h2><p>주문번호 <strong id="order-number"></strong></p><p>이용해 주셔서 감사합니다.</p><button id="restart" class="checkout">새 주문 시작하기</button></dialog><script src="/static/app.js" defer></script></body></html>
